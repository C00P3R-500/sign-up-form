<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="img-container">
        <div>
            <img class="Bimg" src="UKYfootball.webp">
        </div>

        <div class="img-content">
            <img class="logo" src="image-removebg-preview.png">
        </div>

        <div class="imgT"> Photo by 
            <a style="color: white" href="https://www.uky.edu/" target="_blank" rel="noopener noreferrer">
            University of Kentucky
            </a>
        </div>
    </div>

    <div class="con-container">
        <div class="conT">This is a non-functional site and is strictly for educational purposes.
            Feel free to enter any non private information nothing will happen.<br><br> 
            You do you my <em>fellow whoever</em> looking at this.
        </div>

        <div class="form-container">
            <h3 style="margin-left: 50px;">Lets get this</h3>

            <form id="account-form" action="" method="post" style="margin-left: 50px;">

                <div class="form-row">
                        <div class="field">
                        <label for="Fname">FIRST NAME</label>
                        <input type="text" id="Fname" name="Fname" required>
                    </div>

                    <div class="field">
                        <label for="Lname">LAST NAME</label>
                        <input type="text" id="Lname" name="Lname" required>
                    </div>
                </div>

                <div class="form-row">
                        <div class="field">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="field">
                        <label for="phone#">PHONE NUMBER</label>
                        <input type="tel" pattern="\d{10}" maxlength="10" required>
                    </div>
                </div>

                <div class="form-row">
                        <div class="field">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div class="field">
                        <label for="Cpassword">CONFIRM PASSWORD</label>
                        <input type="password" maxlength="10" id="Cpassword" name="Cpassword" required>
                    </div>
                </div>
                
            </form>

        </div>

        <button id="create-btn" type="submit" form="account-form">Create Account</button>
        <div style="margin-left: 50px;">Already have an account? <a style="color: #596D48; font-weight: bold;">Login</a></div>

    </div>
        
    
</body>
</html>
